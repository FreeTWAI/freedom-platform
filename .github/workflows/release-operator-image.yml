name: Release operator image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-operator-image
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main' && github.repository == 'FreeTWAI/freedom-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Admit reviewed main operator source
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_SHA: ${{ job.workflow_sha }}
        run: node deploy/shared-release/image-admission.mjs
      - name: Build only tracked source without deployment credentials
        env:
          IMAGE_SOURCE: ${{ steps.admit.outputs.source_sha }}
          IMAGE_TAG: ${{ steps.admit.outputs.image_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IMAGE_SOURCE"
          test -z "$(git status --porcelain)"
          git archive --format=tar "$IMAGE_SOURCE" | docker build --file deploy/shared-release/image/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/FreeTWAI/freedom-platform \
            --label org.opencontainers.image.revision="$IMAGE_SOURCE" --tag "$IMAGE_TAG" -
      - name: Verify native backup, restore and migration inside the image
        env:
          IMAGE_TAG: ${{ steps.admit.outputs.image_tag }}
          IMAGE_TEST_CONTAINER: operator-image-test-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          RELEASE_IMAGE_TEST_WORK="$(mktemp -d "$RUNNER_TEMP/operator-native.XXXXXX")"
          docker run --name "$IMAGE_TEST_CONTAINER" --init --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --user=1001:1001 \
            --tmpfs=/tmp:rw,nosuid,nodev,size=2g,uid=1001,gid=1001 \
            --mount "type=bind,src=$RELEASE_IMAGE_TEST_WORK,dst=/release/work" \
            --entrypoint=/usr/local/bin/node "$IMAGE_TAG" --import /opt/freedom/node_modules/tsx/dist/loader.mjs \
            /opt/freedom/deploy/shared-release/test/image-native.mjs
          docker rm "$IMAGE_TEST_CONTAINER"
          rm -rf -- "$RELEASE_IMAGE_TEST_WORK"
      - name: Publish image using the short-lived job token
        id: publish
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ steps.admit.outputs.image_tag }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE_TAG"
          docker image inspect "$IMAGE_TAG" --format '{{range .RepoDigests}}{{println .}}{{end}}' > "$RUNNER_TEMP/operator-image-digest.txt"
          node --input-type=module -e '
            import {readFile,appendFile} from "node:fs/promises";
            const image=(await readFile(process.env.RUNNER_TEMP+"/operator-image-digest.txt","utf8")).trim();
            if(!/^ghcr\.io\/freetwai\/freedom-release-operator@sha256:[a-f0-9]{64}$/.test(image)) throw Error("image_digest_invalid");
            await appendFile(process.env.GITHUB_OUTPUT,"image="+image+"\n");
            await appendFile(process.env.GITHUB_STEP_SUMMARY,"\nBuilt and tested image: `"+image+"`\n\nEnvironment pins remain unchanged. Verify repository Actions access to this package and staging acceptance before enabling release.\n");'
      - name: Cleanup container and registry login
        if: always()
        env:
          IMAGE_TEST_CONTAINER: operator-image-test-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker rm --force "$IMAGE_TEST_CONTAINER" >/dev/null 2>&1 || true
          docker logout ghcr.io >/dev/null 2>&1 || true
  verify-pull:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify pinned image pull with a separate read-only job token
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          OPERATOR_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          node --input-type=module -e '
            import {mkdtemp,rm,appendFile} from "node:fs/promises";
            import {join} from "node:path";
            import {pullOperatorImage} from "./deploy/shared-release/operator.mjs";
            const temporaryRoot=await mkdtemp(join(process.env.RUNNER_TEMP,"operator-pull-"));
            try {
              await pullOperatorImage({image:process.env.OPERATOR_IMAGE,temporaryRoot,
                registry:{username:process.env.REGISTRY_USER,token:process.env.REGISTRY_TOKEN}});
              await appendFile(process.env.GITHUB_STEP_SUMMARY,"\nSeparate packages:read job pulled `"+process.env.OPERATOR_IMAGE+"`. Environment pins remain unchanged; deployment has not run.\n");
            } finally {await rm(temporaryRoot,{recursive:true,force:true});}'
