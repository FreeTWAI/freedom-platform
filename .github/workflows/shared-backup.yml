name: Shared backup
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Manual backup environment; manual runs do not prove natural scheduling'
        required: true
        type: choice
        options: [staging-next, next]
permissions:
  contents: read
concurrency:
  group: shared-release
  cancel-in-progress: false
jobs:
  backup:
    if: >-
      github.ref == 'refs/heads/main' && github.repository == 'FreeTWAI/freedom-platform' &&
      (github.event_name == 'schedule' || contains(fromJSON('["staging-next","next"]'), inputs.target))
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(github.event_name == 'schedule' && '["staging-next","next"]' || format('["{0}"]', inputs.target)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: ${{ matrix.target }}
      deployment: false
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      BACKUP_CRON: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Admit the actually deployed source
        id: admit
        env:
          CONTROLLER_SHA: ${{ job.workflow_sha }}
          PUBLIC_RECEIPT_DIRECTORY: ${{ runner.temp }}/backup-public
          GH_TOKEN: ${{ github.token }}
          BACKUP_COMMAND: admit
          BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED }}
          RELEASE_OPERATOR_IMAGE: ${{ vars.RELEASE_OPERATOR_IMAGE }}
          RELEASE_CONFIG_SHA256: ${{ vars.RELEASE_CONFIG_SHA256 }}
          RELEASE_CONFIG_JSON: ${{ secrets.RELEASE_CONFIG_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node controller/deploy/shared-release/backup-cli.mjs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.admit.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Execute scheduled backup
        env:
          CONTROLLER_SHA: ${{ job.workflow_sha }}
          PUBLIC_RECEIPT_DIRECTORY: ${{ runner.temp }}/backup-public
          GH_TOKEN: ${{ github.token }}
          BACKUP_COMMAND: execute
          RELEASE_SHA: ${{ steps.admit.outputs.source_sha }}
          RELEASE_SOURCE_DIRECTORY: ${{ github.workspace }}/source
          BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED }}
          RELEASE_OPERATOR_IMAGE: ${{ vars.RELEASE_OPERATOR_IMAGE }}
          RELEASE_CONFIG_SHA256: ${{ vars.RELEASE_CONFIG_SHA256 }}
          RELEASE_CONFIG_JSON: ${{ secrets.RELEASE_CONFIG_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node controller/deploy/shared-release/backup-cli.mjs
      - name: Stop this run's container after interruption
        if: always()
        env:
          RELEASE_CONTAINER: freedom-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$RELEASE_CONTAINER" >/dev/null 2>&1 || true
      - name: Save public backup receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backup-result-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backup-public/receipt.json
          if-no-files-found: warn
          retention-days: 90
