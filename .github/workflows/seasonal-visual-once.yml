name: Seasonal visual evidence once (PR 1155)
on:
  pull_request:
    types: [synchronize]
    paths: ['.github/workflows/seasonal-visual-once.yml']
permissions:
  contents: read
jobs:
  capture:
    if: >-
      github.event.pull_request.number == 1155 &&
      github.event.pull_request.head.sha == 'aef67d001cf42fc63babfd8b18a66114eddbaf4e' &&
      github.event.pull_request.user.login == 'Hao0321' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'hao/seasonal-interface-candidate-20261028' &&
      github.event.pull_request.base.sha == '5c4bf56df197fa16f3ba303bcbb1c15cfbc5574d' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_USER: freedom_local
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fp_foundation_ci
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U freedom_local -d fp_foundation_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://freedom_local:local-development-only@127.0.0.1:5432/fp_foundation_ci
      PLAYWRIGHT_JSON_OUTPUT_FILE: seasonal-report.json
      SEASONAL_CAPTURE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Require the reviewed product tree unchanged
        env:
          SOURCE: 04d09d6b33990ca8d6531eaf4b7e2978c8605da3
        run: |
          git fetch --no-tags --depth=1 origin "$SOURCE"
          test "$(git show -s --format=%P HEAD)" = "730a96dc301afe66e680cf1c33fa1d40bb31fa2b"
          test "$(git show -s --format=%s HEAD)" = "test(portal): repair seasonal evidence once 1155-20261028-0528"
          git diff --name-only "$SOURCE" HEAD > /tmp/seasonal-changed.txt
          python3 - <<'PY'
          from pathlib import Path
          allowed={'.github/workflows/seasonal-visual-once.yml','scripts/ci/collect-seasonal-visual.mjs','docs/design/seasonal-theme.md'}
          changed=set(Path('/tmp/seasonal-changed.txt').read_text().splitlines())
          assert changed and changed <= allowed, changed
          PY
      - name: Require the bounded failed capture and no prior artifact
        run: |
          curl --fail --silent --show-error --max-time 30 https://api.github.com/repos/FreeTWAI/freedom-platform/actions/runs/40637629050 > /tmp/seasonal-prior-run.json
          curl --fail --silent --show-error --max-time 30 https://api.github.com/repos/FreeTWAI/freedom-platform/actions/runs/40637629050/artifacts > /tmp/seasonal-prior-artifacts.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/seasonal-prior-run.json'));a=json.load(open('/tmp/seasonal-prior-artifacts.json'))
          assert r['id']==40637629050 and r['status']=='completed' and r['conclusion']=='failure' and r['run_attempt']==1
          assert r['head_sha']=='730a96dc301afe66e680cf1c33fa1d40bb31fa2b' and a['total_count']==0
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm run contracts:build
      - run: npm run build
      - name: Reject tracked generated-source drift
        run: git diff --exit-code
      - name: Capture only six seasonal comparisons (24 pictures)
        run: node node_modules/@playwright/test/cli.js test tests/e2e/seasonal-theme.spec.ts --grep 'seasonal before-after on same candidate' --workers=1 --retries=0 --reporter=line,json --output=seasonal-raw
      - name: Bound and validate exact PNG allowlist
        run: node scripts/ci/collect-seasonal-visual.mjs
      - name: Retain only the bounded seasonal pictures for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seasonal-visual-1155-${{ github.event.pull_request.head.sha }}
          path: seasonal-evidence/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
